<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor CPU & Disk</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f3; color: #1a1a1a; padding: 1.5rem; min-height: 100vh; }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; color: #f0f0ee; }
    .card { background: #242424; border-color: rgba(255,255,255,0.1); }
    .bar-track, .core-track { background: #333; }
    .disk-row { border-color: rgba(255,255,255,0.08); }
    .ctrl-btn { border-color: rgba(255,255,255,0.2); color: #aaa; }
    .ctrl-btn.active { background: #333; color: #f0f0ee; }
    .big-num, .disk-val, .core-val { color: #f0f0ee; }
    .card-title, .sub, .core-lbl, .disk-name, .legend span { color: #aaa; }
    #status-bar { background: #2a2a2a; border-color: rgba(255,255,255,0.08); }
  }
  h1 { font-size: 18px; font-weight: 500; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 8px; }
  #status-bar { font-size: 12px; color: #888; background: #f0f0ee; border: 0.5px solid rgba(0,0,0,0.1); border-radius: 8px; padding: 7px 14px; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 8px; }
  #ws-dot { width: 7px; height: 7px; border-radius: 50%; background: #888; display: inline-block; flex-shrink: 0; }
  .ws-ok   { background: #3B6D11 !important; }
  .ws-err  { background: #A32D2D !important; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
  .card { background: #fff; border: 0.5px solid rgba(0,0,0,0.1); border-radius: 12px; padding: 1rem 1.25rem; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
  .card-title { font-size: 13px; font-weight: 500; color: #666; display: flex; align-items: center; gap: 6px; }
  .big-num { font-size: 36px; font-weight: 500; line-height: 1; }
  .sub { font-size: 12px; color: #888; margin-top: 4px; }
  .bar-track { background: #f0f0ee; border-radius: 4px; height: 6px; margin: 6px 0 14px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
  .core-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; color: #888; }
  .core-lbl { min-width: 48px; }
  .core-track { flex: 1; background: #f0f0ee; border-radius: 3px; height: 5px; overflow: hidden; }
  .core-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
  .core-val { min-width: 32px; text-align: right; font-weight: 500; }
  .disk-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 0.5px solid rgba(0,0,0,0.07); font-size: 13px; }
  .disk-row:last-child { border-bottom: none; }
  .disk-name { color: #888; display: flex; align-items: center; gap: 6px; }
  .disk-val { font-weight: 500; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot-ok { background: #3B6D11; }
  .dot-warn { background: #BA7517; }
  .dot-danger { background: #A32D2D; }
  .ctrl-row { display: flex; gap: 8px; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }
  .ctrl-label { font-size: 12px; color: #888; }
  .ctrl-btn { font-size: 12px; padding: 5px 12px; border: 0.5px solid rgba(0,0,0,0.2); border-radius: 8px; background: transparent; cursor: pointer; color: #666; transition: all 0.15s; }
  .ctrl-btn:hover { background: #f0f0ee; }
  .ctrl-btn.active { background: #f0f0ee; color: #1a1a1a; font-weight: 500; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: #888; margin-bottom: 8px; flex-wrap: wrap; }
  .ld { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: middle; }
  .gauge-wrap { position: relative; width: 100%; height: 180px; }
  input[type=text] { font-size: 12px; padding: 5px 10px; border: 0.5px solid rgba(0,0,0,0.2); border-radius: 8px; background: transparent; color: inherit; width: 220px; }
</style>
</head>
<body>

<h1><i class="ti ti-activity"></i> Monitor Sistem</h1>

<!-- Status Bar -->
<div id="status-bar">
  <span id="ws-dot"></span>
  <span id="ws-label">Belum konek</span>
  <span style="margin-left:auto; display:flex; gap:8px; align-items:center;">
    <input type="text" id="ws-url" value="ws://10.x.x.x:8000/ws/metrics" placeholder="ws://IP-ZeroTier:8000/ws/metrics" />
    <button class="ctrl-btn" onclick="reconnect()">Konek</button>
  </span>
</div>

<div class="ctrl-row">
  <span class="ctrl-label">Grafik:</span>
  <button class="ctrl-btn active" id="pauseBtn" onclick="togglePause(this)"><i class="ti ti-player-pause"></i> Live</button>
</div>

<div class="grid2">
  <!-- CPU -->
  <div class="card">
    <div class="card-head">
      <div class="card-title"><i class="ti ti-cpu"></i> CPU</div>
      <span class="status-dot dot-ok" id="cpu-dot"></span>
    </div>
    <div style="display:flex; align-items:baseline; gap:4px;">
      <span class="big-num" id="cpu-total">—</span>
      <span style="font-size:16px; color:#888;">%</span>
    </div>
    <div class="sub" id="cpu-sub">Menunggu data...</div>
    <div style="margin:1rem 0 0.5rem; font-size:11px; color:#888;">Per core</div>
    <div id="cores"></div>
    <div style="margin-top:1rem;">
      <div class="legend">
        <span><span class="ld" style="background:#185FA5"></span>CPU %</span>
        <span><span class="ld" style="background:#7F77DD; border-radius:50%;"></span>Suhu °C</span>
      </div>
      <div class="gauge-wrap"><canvas id="cpuChart"></canvas></div>
    </div>
  </div>

  <!-- Disk -->
  <div class="card">
    <div class="card-head">
      <div class="card-title"><i class="ti ti-device-floppy"></i> Disk</div>
      <span class="status-dot dot-ok" id="disk-dot"></span>
    </div>
    <div style="display:flex; align-items:baseline; gap:4px;">
      <span class="big-num" id="disk-io">—</span>
      <span style="font-size:13px; color:#888; margin-left:2px;">MB/s</span>
    </div>
    <div class="sub">I/O throughput sekarang</div>
    <div style="margin-top:1rem;">
      <div class="disk-row">
        <span class="disk-name"><i class="ti ti-database" style="font-size:13px"></i> Kapasitas</span>
        <span class="disk-val" id="disk-cap">—</span>
      </div>
      <div class="disk-row">
        <span class="disk-name"><i class="ti ti-arrow-up" style="font-size:13px"></i> Write</span>
        <span class="disk-val" id="disk-write">—</span>
      </div>
      <div class="disk-row">
        <span class="disk-name"><i class="ti ti-arrow-down" style="font-size:13px"></i> Read</span>
        <span class="disk-val" id="disk-read">—</span>
      </div>
      <div class="disk-row">
        <span class="disk-name"><i class="ti ti-clock" style="font-size:13px"></i> Latensi</span>
        <span class="disk-val" id="disk-lat">—</span>
      </div>
    </div>
    <div style="margin-top:1rem;">
      <div style="font-size:11px; color:#888; margin-bottom:6px;" id="disk-storage-label">Pemakaian disk</div>
      <div class="bar-track"><div class="bar-fill" id="disk-bar" style="width:0%; background:#185FA5;"></div></div>
      <div style="font-size:11px; color:#888; display:flex; justify-content:space-between;">
        <span id="disk-used-lbl">— terpakai</span>
        <span id="disk-free-lbl">— bebas</span>
      </div>
    </div>
    <div style="margin-top:1rem;">
      <div class="legend">
        <span><span class="ld" style="background:#1D9E75"></span>Read MB/s</span>
        <span><span class="ld" style="background:#D85A30; border-radius:50%;"></span>Write MB/s</span>
      </div>
      <div class="gauge-wrap"><canvas id="diskChart"></canvas></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const MAX = 40;
let paused = false;
let ws = null;
let reconnectTimer = null;

let cpuHist   = Array(MAX).fill(null);
let tempHist  = Array(MAX).fill(null);
let readHist  = Array(MAX).fill(null);
let writeHist = Array(MAX).fill(null);

// ── Charts ───────────────────────────────────────────────
const cpuChart = new Chart(document.getElementById('cpuChart'), {
  type: 'line',
  data: {
    labels: Array(MAX).fill(''),
    datasets: [
      { label:'CPU %', data:[...cpuHist],  borderColor:'#185FA5', borderWidth:2,   pointRadius:0, tension:0.4, fill:false, yAxisID:'y'  },
      { label:'Suhu',  data:[...tempHist], borderColor:'#7F77DD', borderDash:[4,3], borderWidth:1.5, pointRadius:0, tension:0.4, fill:false, yAxisID:'y2' }
    ]
  },
  options: {
    responsive:true, maintainAspectRatio:false, animation:{duration:300},
    plugins:{ legend:{display:false} },
    scales:{
      y:  { min:0, max:100, ticks:{font:{size:10},color:'#888',callback:v=>v+'%'}, grid:{color:'rgba(136,135,128,0.12)'} },
      y2: { position:'right', min:30, max:105, ticks:{font:{size:10},color:'#7F77DD',callback:v=>v+'°'}, grid:{drawOnChartArea:false} },
      x:  { display:false }
    }
  }
});

const diskChart = new Chart(document.getElementById('diskChart'), {
  type: 'line',
  data: {
    labels: Array(MAX).fill(''),
    datasets: [
      { label:'Read',  data:[...readHist],  borderColor:'#1D9E75', borderWidth:2,   pointRadius:0, tension:0.4, fill:false },
      { label:'Write', data:[...writeHist], borderColor:'#D85A30', borderDash:[4,3], borderWidth:1.5, pointRadius:0, tension:0.4, fill:false }
    ]
  },
  options: {
    responsive:true, maintainAspectRatio:false, animation:{duration:300},
    plugins:{ legend:{display:false} },
    scales:{
      y: { min:0, ticks:{font:{size:10},color:'#888',callback:v=>v+' MB/s'}, grid:{color:'rgba(136,135,128,0.12)'} },
      x: { display:false }
    }
  }
});

// ── Status dot helpers ───────────────────────────────────
function dotClass(val, warn, danger) {
  if (val >= danger) return 'dot-danger';
  if (val >= warn)   return 'dot-warn';
  return 'dot-ok';
}

// ── Core bars ────────────────────────────────────────────
function renderCores(cores) {
  const el = document.getElementById('cores');
  if (el.children.length !== cores.length) {
    el.innerHTML = cores.map((_, i) => `
      <div class="core-row">
        <span class="core-lbl">Core ${i}</span>
        <div class="core-track"><div class="core-fill" id="cf${i}" style="width:0%;background:#185FA5;"></div></div>
        <span class="core-val" id="cv${i}">0%</span>
      </div>`).join('');
  }
  cores.forEach((v, i) => {
    const f = document.getElementById('cf'+i);
    const c = document.getElementById('cv'+i);
    if (f) { f.style.width = v+'%'; f.style.background = v>=80?'#A32D2D':v>=60?'#BA7517':'#185FA5'; }
    if (c) c.textContent = v+'%';
  });
}

// ── Update UI dari data WebSocket ────────────────────────
function applyMetrics(d) {
  if (paused) return;

  // CPU
  const cpu = d.cpu;
  document.getElementById('cpu-total').textContent = cpu.total;
  document.getElementById('cpu-sub').textContent   = cpu.temp != null ? 'Suhu: '+cpu.temp+'°C' : 'Suhu: —';
  document.getElementById('cpu-dot').className     = 'status-dot ' + dotClass(cpu.total, 60, 85);
  renderCores(cpu.cores);

  cpuHist.push(cpu.total);       if (cpuHist.length  > MAX) cpuHist.shift();
  tempHist.push(cpu.temp ?? null); if (tempHist.length > MAX) tempHist.shift();
  cpuChart.data.datasets[0].data = [...cpuHist];
  cpuChart.data.datasets[1].data = [...tempHist];
  cpuChart.update('none');

  // Disk
  const disk = d.disk;
  const totalIO = Math.round((disk.read_mbs + disk.write_mbs) * 10) / 10;
  document.getElementById('disk-io').textContent    = totalIO;
  document.getElementById('disk-write').textContent = disk.write_mbs.toFixed(1)+' MB/s';
  document.getElementById('disk-read').textContent  = disk.read_mbs.toFixed(1)+' MB/s';
  document.getElementById('disk-lat').textContent   = Math.round(2 + (totalIO/200)*18)+' ms';
  document.getElementById('disk-cap').textContent   = disk.total_gb+' GB';
  document.getElementById('disk-bar').style.width   = disk.percent+'%';
  document.getElementById('disk-used-lbl').textContent = disk.used_gb+' GB terpakai';
  document.getElementById('disk-free-lbl').textContent = disk.free_gb+' GB bebas';
  document.getElementById('disk-storage-label').textContent = 'Pemakaian disk ('+disk.total_gb+' GB) — '+disk.percent+'%';
  document.getElementById('disk-dot').className     = 'status-dot ' + dotClass(disk.percent, 75, 90);

  readHist.push(disk.read_mbs);   if (readHist.length  > MAX) readHist.shift();
  writeHist.push(disk.write_mbs); if (writeHist.length > MAX) writeHist.shift();
  diskChart.data.datasets[0].data = [...readHist];
  diskChart.data.datasets[1].data = [...writeHist];
  diskChart.update('none');
}

// ── WebSocket ────────────────────────────────────────────
function setStatus(ok, msg) {
  document.getElementById('ws-dot').className   = ok ? 'ws-ok' : 'ws-err';
  document.getElementById('ws-label').textContent = msg;
}

function connect(url) {
  if (ws) { ws.onclose = null; ws.close(); }
  setStatus(false, 'Menghubungkan ke '+url+' ...');
  ws = new WebSocket(url);

  ws.onopen = () => {
    setStatus(true, 'Terhubung — '+url);
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  };

  ws.onmessage = (e) => {
    try { applyMetrics(JSON.parse(e.data)); } catch(_) {}
  };

  ws.onerror = () => setStatus(false, 'Gagal konek');

  ws.onclose = () => {
    setStatus(false, 'Koneksi putus — coba lagi dalam 5 detik...');
    reconnectTimer = setTimeout(() => connect(document.getElementById('ws-url').value.trim()), 5000);
  };
}

function reconnect() {
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  connect(document.getElementById('ws-url').value.trim());
}

function togglePause(btn) {
  paused = !paused;
  btn.innerHTML = paused
    ? '<i class="ti ti-player-play"></i> Paused'
    : '<i class="ti ti-player-pause"></i> Live';
  btn.classList.toggle('active', !paused);
}

// Auto-konek saat load jika URL sudah diisi user
window.addEventListener('load', () => {
  const url = document.getElementById('ws-url').value.trim();
  if (!url.includes('x.x.x')) connect(url);
});
</script>
</body>
</html>
